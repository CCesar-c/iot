<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>

<body>
    <input id="email" placeholder="email" type="email">
    <input id="senha" placeholder="senha" type="password">
    <button onclick="logar()">entrar</button>

    <script>
        async function logar() {
            let email = document.querySelector("#email").value
            let senha = document.querySelector("#senha").value

            const receber = await fetch("http://localhost:3331/usuarios_logar", {
                method: "Post",
                headers: {
                    "Content-Type": "Application/json"
                },
                body: JSON.stringify({
                    email,
                    senha
                })
            });
            let token = await receber.json()
            console.log(token.token)
            if (token) {
                alert("entrando no sistema");
                localStorage.setItem("email", email)
                localStorage.setItem("token", token.token)
                window.location.href = "http://127.0.0.1:5500/src/public/index.html";
            } else {
                alert("email ou senha erradas");
            }

        }
    </script>
</body>

</html>
